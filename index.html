<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A clean, modern to-do list." />
  <title>Tasks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f4f5f7;
      --surface: #ffffff;
      --surface-2: #f8f9fb;
      --border: #e4e6eb;
      --text: #16181d;
      --muted: #6b7280;
      --accent: #4f46e5;
      --accent-soft: #eef2ff;
      --danger: #dc2626;
      --high: #ef4444;
      --med: #f59e0b;
      --low: #10b981;
      --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 8px 24px rgba(16, 24, 40, .06);
      --radius: 14px;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0e1014;
        --surface: #171a21;
        --surface-2: #1d212a;
        --border: #2a2f3a;
        --text: #eceef2;
        --muted: #8b93a3;
        --accent: #818cf8;
        --accent-soft: #23264a;
        --danger: #f87171;
        --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
      }
    }
    :root[data-theme="dark"] {
      --bg: #0e1014;
      --surface: #171a21;
      --surface-2: #1d212a;
      --border: #2a2f3a;
      --text: #eceef2;
      --muted: #8b93a3;
      --accent: #818cf8;
      --accent-soft: #23264a;
      --danger: #f87171;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
      transition: background .25s, color .25s;
    }
    button, input, select { font: inherit; color: inherit; }
    button { cursor: pointer; background: none; border: none; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

    .app { max-width: 640px; margin: 0 auto; padding: 48px 16px 64px; }

    /* Header */
    header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 28px; }
    .date { color: var(--muted); font-size: 14px; font-weight: 500; }
    h1 { font-size: 32px; font-weight: 700; letter-spacing: -0.02em; margin-top: 2px; }
    .icon-btn {
      width: 40px; height: 40px; flex-shrink: 0;
      display: grid; place-items: center;
      border-radius: 10px; border: 1px solid var(--border);
      background: var(--surface); color: var(--muted);
      transition: color .15s, border-color .15s;
    }
    .icon-btn:hover { color: var(--text); border-color: var(--muted); }
    .icon-btn svg { width: 18px; height: 18px; }

    /* Progress */
    .progress-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); box-shadow: var(--shadow);
      padding: 18px 20px; margin-bottom: 16px;
    }
    .progress-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
    .progress-label { font-size: 14px; color: var(--muted); }
    .progress-label strong { color: var(--text); font-weight: 600; }
    .progress-pct { font-size: 14px; font-weight: 600; color: var(--accent); }
    .bar { height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
    .bar > span { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .4s cubic-bezier(.2,.8,.2,1); }

    /* Add form */
    .add {
      display: flex; gap: 8px; align-items: center;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); box-shadow: var(--shadow);
      padding: 8px; margin-bottom: 20px;
      transition: border-color .15s;
    }
    .add:focus-within { border-color: var(--accent); }
    .add input[type="text"] {
      flex: 1; min-width: 0; border: none; background: transparent;
      padding: 10px 12px; font-size: 15px; outline: none;
    }
    .add input::placeholder { color: var(--muted); }
    .add select {
      border: 1px solid var(--border); background: var(--surface-2);
      border-radius: 8px; padding: 8px 10px; font-size: 13px; font-weight: 500;
      outline: none;
    }
    .add-btn {
      background: var(--accent); color: #fff; font-weight: 600; font-size: 14px;
      padding: 10px 18px; border-radius: 10px; white-space: nowrap;
      transition: filter .15s, transform .1s;
    }
    .add-btn:hover { filter: brightness(1.08); }
    .add-btn:active { transform: scale(.97); }

    /* Toolbar */
    .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
    .filters { display: inline-flex; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 3px; }
    .filters button {
      font-size: 13px; font-weight: 500; color: var(--muted);
      padding: 6px 14px; border-radius: 7px; transition: all .15s;
    }
    .filters button:hover { color: var(--text); }
    .filters button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
    .clear { font-size: 13px; color: var(--muted); font-weight: 500; padding: 6px 4px; }
    .clear:hover { color: var(--danger); }
    .clear:disabled { opacity: .4; cursor: default; color: var(--muted); }

    /* List */
    .list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
    .item {
      display: flex; align-items: center; gap: 12px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 12px 12px 12px 14px;
      position: relative; overflow: hidden;
      animation: in .25s ease-out;
      transition: border-color .15s, opacity .2s, transform .2s;
    }
    .item::before {
      content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
      background: var(--prio, transparent);
    }
    .item[data-priority="high"] { --prio: var(--high); }
    .item[data-priority="medium"] { --prio: var(--med); }
    .item[data-priority="low"] { --prio: var(--low); }
    .item:hover { border-color: var(--muted); }
    .item.removing { opacity: 0; transform: translateX(16px); }
    .item.dragging { opacity: .5; }
    .item.drag-over { border-color: var(--accent); }
    @keyframes in { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }

    .check {
      width: 22px; height: 22px; flex-shrink: 0; border-radius: 50%;
      border: 2px solid var(--border); display: grid; place-items: center;
      transition: all .2s;
    }
    .check:hover { border-color: var(--accent); }
    .check svg { width: 12px; height: 12px; color: #fff; opacity: 0; transform: scale(.5); transition: all .2s; }
    .item.done .check { background: var(--accent); border-color: var(--accent); }
    .item.done .check svg { opacity: 1; transform: scale(1); }

    .content { flex: 1; min-width: 0; }
    .title { font-size: 15px; word-break: break-word; cursor: text; transition: color .2s; }
    .item.done .title { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--muted); }
    .meta { font-size: 12px; color: var(--muted); margin-top: 1px; }
    .edit-input {
      width: 100%; font-size: 15px; border: 1px solid var(--accent);
      background: var(--surface-2); border-radius: 6px; padding: 4px 8px; outline: none;
    }

    .actions { display: flex; gap: 2px; opacity: 0; transition: opacity .15s; }
    .item:hover .actions, .item:focus-within .actions { opacity: 1; }
    @media (hover: none) { .actions { opacity: 1; } }
    .actions button {
      width: 32px; height: 32px; display: grid; place-items: center;
      border-radius: 8px; color: var(--muted); transition: all .15s;
    }
    .actions button:hover { background: var(--surface-2); color: var(--text); }
    .actions button.del:hover { color: var(--danger); }
    .actions svg { width: 16px; height: 16px; }
    .handle { cursor: grab; color: var(--muted); opacity: .4; display: grid; place-items: center; }
    .handle svg { width: 14px; height: 14px; }

    /* Empty */
    .empty { text-align: center; padding: 56px 16px; color: var(--muted); }
    .empty svg { width: 48px; height: 48px; margin-bottom: 12px; opacity: .5; }
    .empty h3 { color: var(--text); font-size: 16px; font-weight: 600; margin-bottom: 4px; }
    .empty p { font-size: 14px; }

    footer { text-align: center; margin-top: 32px; font-size: 12px; color: var(--muted); }
    kbd { font-family: inherit; font-size: 11px; background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; }

    @media (max-width: 480px) {
      .app { padding-top: 28px; }
      h1 { font-size: 26px; }
      .add { flex-wrap: wrap; }
      .add input[type="text"] { flex-basis: 100%; }
      .add select { flex: 1; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div>
        <p class="date" id="date"></p>
        <h1>My Tasks</h1>
      </div>
      <button class="icon-btn" id="themeBtn" aria-label="Toggle dark mode" title="Toggle theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
    </header>

    <section class="progress-card" aria-label="Progress">
      <div class="progress-top">
        <span class="progress-label"><strong id="doneCount">0</strong> of <strong id="totalCount">0</strong> tasks completed</span>
        <span class="progress-pct" id="pct">0%</span>
      </div>
      <div class="bar"><span id="bar"></span></div>
    </section>

    <form class="add" id="addForm" autocomplete="off">
      <input type="text" id="newTask" placeholder="What needs to be done?" aria-label="New task" maxlength="200" />
      <select id="priority" aria-label="Priority">
        <option value="none">No priority</option>
        <option value="low">Low</option>
        <option value="medium">Medium</option>
        <option value="high">High</option>
      </select>
      <button type="submit" class="add-btn">Add task</button>
    </form>

    <div class="toolbar">
      <div class="filters" role="group" aria-label="Filter tasks">
        <button type="button" data-filter="all" aria-pressed="true">All</button>
        <button type="button" data-filter="active" aria-pressed="false">Active</button>
        <button type="button" data-filter="completed" aria-pressed="false">Completed</button>
      </div>
      <button type="button" class="clear" id="clearBtn">Clear completed</button>
    </div>

    <ul class="list" id="list" aria-live="polite"></ul>

    <div class="empty" id="empty" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      <h3 id="emptyTitle">No tasks yet</h3>
      <p id="emptyText">Add your first task above to get started.</p>
    </div>

    <footer>Double-click a task to edit &middot; Drag to reorder &middot; <kbd>/</kbd> to focus input</footer>
  </main>

  <script>
    (() => {
      const STORAGE_KEY = "todo-app-v1";
      const THEME_KEY = "todo-theme";

      const $ = (s) => document.querySelector(s);
      const list = $("#list");
      const form = $("#addForm");
      const input = $("#newTask");
      const prioritySel = $("#priority");
      const emptyEl = $("#empty");
      const clearBtn = $("#clearBtn");

      const icons = {
        check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
        edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
        trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>',
        grip: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>',
        moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>',
        sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>'
      };

      // ---------- Storage (safe) ----------
      const store = {
        get(key, fallback) {
          try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
          catch { return fallback; }
        },
        set(key, value) {
          try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* storage unavailable */ }
        }
      };

      let tasks = store.get(STORAGE_KEY, []);
      let filter = "all";
      let dragId = null;

      const save = () => store.set(STORAGE_KEY, tasks);
      const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

      // ---------- Date header ----------
      $("#date").textContent = new Date().toLocaleDateString(undefined, {
        weekday: "long", day: "numeric", month: "long"
      });

      // ---------- Theme ----------
      const root = document.documentElement;
      const themeBtn = $("#themeBtn");
      const systemDark = () => window.matchMedia("(prefers-color-scheme: dark)").matches;
      const isDark = () => root.dataset.theme ? root.dataset.theme === "dark" : systemDark();
      const applyTheme = (t) => {
        if (t) root.dataset.theme = t;
        themeBtn.innerHTML = isDark() ? icons.sun : icons.moon;
      };
      applyTheme(store.get(THEME_KEY, null));
      themeBtn.addEventListener("click", () => {
        const next = isDark() ? "light" : "dark";
        applyTheme(next);
        store.set(THEME_KEY, next);
      });

      // ---------- Helpers ----------
      const timeAgo = (ts) => {
        const s = Math.floor((Date.now() - ts) / 1000);
        if (s < 60) return "just now";
        const m = Math.floor(s / 60); if (m < 60) return `${m}m ago`;
        const h = Math.floor(m / 60); if (h < 24) return `${h}h ago`;
        const d = Math.floor(h / 24); if (d < 7) return `${d}d ago`;
        return new Date(ts).toLocaleDateString();
      };
      const prioLabel = { high: "High priority", medium: "Medium priority", low: "Low priority" };

      // ---------- Render ----------
      function render() {
        const visible = tasks.filter(t =>
          filter === "all" ? true : filter === "active" ? !t.done : t.done
        );

        list.innerHTML = "";
        visible.forEach(t => list.appendChild(buildItem(t)));

        // Empty state
        const emptyCopy = {
          all: ["No tasks yet", "Add your first task above to get started."],
          active: ["All caught up", "Nothing left to do. Nice work."],
          completed: ["Nothing completed yet", "Tick off a task and it will show up here."]
        }[filter];
        emptyEl.hidden = visible.length > 0;
        $("#emptyTitle").textContent = emptyCopy[0];
        $("#emptyText").textContent = emptyCopy[1];

        // Stats
        const total = tasks.length;
        const done = tasks.filter(t => t.done).length;
        const pct = total ? Math.round((done / total) * 100) : 0;
        $("#doneCount").textContent = done;
        $("#totalCount").textContent = total;
        $("#pct").textContent = pct + "%";
        $("#bar").style.width = pct + "%";
        clearBtn.disabled = done === 0;
        document.title = total - done > 0 ? `(${total - done}) Tasks` : "Tasks";
      }

      function buildItem(t) {
        const li = document.createElement("li");
        li.className = "item" + (t.done ? " done" : "");
        li.dataset.id = t.id;
        li.dataset.priority = t.priority;
        li.draggable = true;

        const meta = [prioLabel[t.priority], timeAgo(t.created)].filter(Boolean).join(" · ");

        li.innerHTML = `
          <span class="handle" aria-hidden="true">${icons.grip}</span>
          <button class="check" data-action="toggle" aria-label="${t.done ? "Mark as not done" : "Mark as done"}">${icons.check}</button>
          <div class="content">
            <div class="title"></div>
            <div class="meta">${meta}</div>
          </div>
          <div class="actions">
            <button data-action="edit" aria-label="Edit task" title="Edit">${icons.edit}</button>
            <button class="del" data-action="delete" aria-label="Delete task" title="Delete">${icons.trash}</button>
          </div>`;
        li.querySelector(".title").textContent = t.text; // safe: no HTML injection
        return li;
      }

      // ---------- Actions ----------
      function addTask(text, priority) {
        tasks.unshift({ id: uid(), text, priority, done: false, created: Date.now() });
        save(); render();
      }

      function toggleTask(id) {
        const t = tasks.find(x => x.id === id);
        if (t) { t.done = !t.done; save(); render(); }
      }

      function deleteTask(id) {
        const li = list.querySelector(`[data-id="${id}"]`);
        const finish = () => { tasks = tasks.filter(x => x.id !== id); save(); render(); };
        if (li) { li.classList.add("removing"); setTimeout(finish, 180); } else finish();
      }

      function startEdit(id) {
        const li = list.querySelector(`[data-id="${id}"]`);
        const t = tasks.find(x => x.id === id);
        if (!li || !t) return;
        const titleEl = li.querySelector(".title");
        const field = document.createElement("input");
        field.className = "edit-input";
        field.value = t.text;
        field.maxLength = 200;
        titleEl.replaceWith(field);
        li.draggable = false;
        field.focus();
        field.setSelectionRange(field.value.length, field.value.length);

        let finished = false;
        const commit = (keep) => {
          if (finished) return; finished = true;
          const val = field.value.trim();
          if (keep && val) { t.text = val; save(); }
          else if (keep && !val) { deleteTask(id); return; }
          render();
        };
        field.addEventListener("keydown", (e) => {
          if (e.key === "Enter") commit(true);
          if (e.key === "Escape") commit(false);
        });
        field.addEventListener("blur", () => commit(true));
      }

      // ---------- Events ----------
      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const text = input.value.trim();
        if (!text) { input.focus(); return; }
        addTask(text, prioritySel.value);
        input.value = "";
        prioritySel.value = "none";
        input.focus();
      });

      list.addEventListener("click", (e) => {
        const btn = e.target.closest("[data-action]");
        if (!btn) return;
        const id = btn.closest(".item").dataset.id;
        const action = btn.dataset.action;
        if (action === "toggle") toggleTask(id);
        if (action === "delete") deleteTask(id);
        if (action === "edit") startEdit(id);
      });

      list.addEventListener("dblclick", (e) => {
        const title = e.target.closest(".title");
        if (title) startEdit(title.closest(".item").dataset.id);
      });

      document.querySelectorAll("[data-filter]").forEach(btn => {
        btn.addEventListener("click", () => {
          filter = btn.dataset.filter;
          document.querySelectorAll("[data-filter]").forEach(b =>
            b.setAttribute("aria-pressed", String(b === btn)));
          render();
        });
      });

      clearBtn.addEventListener("click", () => {
        tasks = tasks.filter(t => !t.done);
        save(); render();
      });

      document.addEventListener("keydown", (e) => {
        if (e.key === "/" && document.activeElement.tagName !== "INPUT") {
          e.preventDefault(); input.focus();
        }
      });

      // ---------- Drag & drop reorder ----------
      list.addEventListener("dragstart", (e) => {
        const li = e.target.closest(".item");
        if (!li) return;
        dragId = li.dataset.id;
        li.classList.add("dragging");
        e.dataTransfer.effectAllowed = "move";
        try { e.dataTransfer.setData("text/plain", dragId); } catch {}
      });
      list.addEventListener("dragover", (e) => {
        e.preventDefault();
        const over = e.target.closest(".item");
        list.querySelectorAll(".drag-over").forEach(el => el.classList.remove("drag-over"));
        if (over && over.dataset.id !== dragId) over.classList.add("drag-over");
      });
      list.addEventListener("drop", (e) => {
        e.preventDefault();
        const over = e.target.closest(".item");
        if (!over || !dragId || over.dataset.id === dragId) return;
        const from = tasks.findIndex(t => t.id === dragId);
        const to = tasks.findIndex(t => t.id === over.dataset.id);
        const [moved] = tasks.splice(from, 1);
        tasks.splice(to, 0, moved);
        save(); render();
      });
      list.addEventListener("dragend", () => {
        dragId = null;
        list.querySelectorAll(".dragging, .drag-over").forEach(el =>
          el.classList.remove("dragging", "drag-over"));
      });

      // Refresh relative timestamps every minute
      setInterval(() => { if (!document.querySelector(".edit-input")) render(); }, 60000);

      render();
    })();
  </script>
</body>
</html>
